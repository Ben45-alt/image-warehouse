# Keep-alive: ping เว็บเป็นระยะ เพื่อไม่ให้ Streamlit Community Cloud "หลับ"
# ผลที่ได้: คนเปิดเว็บ/ถ่ายรูปมือถือแล้วไม่ต้องรอบูตใหม่ (cold start) + token ถูกใช้สม่ำเสมอ
# ฟรี 100% เพราะ repo เป็น public (GitHub Actions ไม่จำกัดนาทีสำหรับ repo public)
#
# หมายเหตุ:
# - เวลาใน cron เป็น UTC. ไทย = UTC+7 → 00:00-11:xx UTC = 07:00-18:xx เวลาไทย
# - GitHub อาจดีเลย์รอบ schedule ได้บ้าง (ไม่เป๊ะทุก 10 นาที) แต่พอสำหรับกันหลับ
# - ⚠️ ถ้า repo ไม่มี commit ใหม่เลยเกิน 60 วัน GitHub จะปิด workflow นี้อัตโนมัติ
#   → ถ้าเงียบนานให้เข้าแท็บ Actions กด "Enable workflow" อีกครั้ง

name: keep-alive

on:
  schedule:
    # ทุก ~10 นาที ช่วง 00:00-11:59 UTC (07:00-18:59 เวลาไทย) ทุกวัน
    - cron: "*/10 0-11 * * *"
  workflow_dispatch: {}   # เผื่อกดรันเองจากแท็บ Actions เพื่อทดสอบ

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app (keep awake)
        run: |
          # ใช้ /healthz — endpoint สุขภาพของตัวแอป คืน 200 ตรงๆ ไม่โดน redirect ไปหน้า auth
          # (ต่างจาก / และ /_stcore/health ที่เด้ง 303 ไป share.streamlit.io/-/auth)
          URL="https://image-warehouse-mis.streamlit.app/healthz"
          echo "Pinging $URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 4 --retry-delay 5 --retry-all-errors --max-time 90 \
            -A "keep-alive-bot" "$URL" || echo "000")
          echo "GET /healthz -> HTTP $code"
          # ถ้าไม่ใช่ 200 ให้ job ล้มเหลว (จะได้เห็นในแท็บ Actions ว่ามีปัญหา)
          test "$code" = "200"
